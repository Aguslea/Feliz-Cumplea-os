<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ale ❤️</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #120b18, #30152d, #160b20);
        font-family: Arial, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .portada {
        width: 90%;
        max-width: 500px;
    }

    h1 {
        color: white;
        font-size: 42px;
        margin-bottom: 15px;
    }

    p {
        color: #e8cfe3;
        font-size: 20px;
        margin-bottom: 35px;
    }

    button {
        background: #d86bb5;
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 30px;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        transition: transform 0.2s, background 0.2s;
    }

    button:hover {
        background: #e58ac7;
        transform: scale(1.05);
    }

        button:active {
        transform: scale(0.95);
    }

    #introduccion {
        opacity: 1;
        transition: opacity 1.5s ease;
    }

#introduccion.oculto {
    opacity: 0;
    pointer-events: none;
}

#carta {
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 1.2s ease, transform 1.2s ease;
}

#carta.visible {
    opacity: 1;
    transform: translateY(0);
}

</style>

</head>
<body>

<div class="portada">

    <h1>Feliz cumpleaños, Ale ❤️</h1>

    <div id="introduccion">

    <p>Hay cosas que no entran en una caja.</p>

    <button onclick="mostrarCarta()">Abrí esto 🎁</button>

</div>

    <div id="carta" style="display: none; margin-top: 40px; color: white;">

        <h2>Es para vos</h2>

        <p>
            Hay algo que quiero decirte...
        </p>

    </div>

</div>
    <script>
function mostrarCarta() {
    document.getElementById("introduccion").classList.add("oculto");

    setTimeout(function() {
    const carta = document.getElementById("carta");
    carta.style.display = "block";

    setTimeout(function() {
        carta.classList.add("visible");
    }, 50);

}, 1500);
}
</script>
</body>
</html>
